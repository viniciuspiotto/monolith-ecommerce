services:
  elasticsearch:
    image: elasticsearch:9.2.0
    container_name: elasticsearch_dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data_dev:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --requirepass monolithPassword123

volumes:
  elastic_data_dev:
    driver: local

  redis_data_dev:
    driver: local