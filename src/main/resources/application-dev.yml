spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.h2.Driver

  elasticsearch:
    uris: http://localhost:9200

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

api:
  security:
    token:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expiration-hours: ${JWT_EXPIRATION_HOURS}
    cookie:
      name: jwt-token
      secure: ${JWT_COOKIE_SECURE}

mercadoPago:
  accessToken: ${MERCADO_PAGO_ACCESS_TOKEN}
  notificationURL: ${MERCADO_PAGO_NOTIFICATION_URL}