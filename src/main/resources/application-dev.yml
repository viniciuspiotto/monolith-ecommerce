spring:
  mvc:
    servlet:
      path: /api/${MONOLITH_VERSION}

  datasource:
    url: ${POSTGRESQL_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: true
      password: ${REDIS_PASSWORD}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

api:
  security:
    token:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expiration-hours: ${JWT_EXPIRATION_HOURS}
    cookie:
      name: jwt-token
      secure: ${JWT_COOKIE_SECURE}

server:
  port: ${SERVER_PORT:-8082}
  servlet:
    session:
      timeout: 30m

mercadoPago:
  accessToken: ${MERCADO_PAGO_ACCESS_TOKEN}
  notificationURL: ${MERCADO_PAGO_NOTIFICATION_URL}

aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  bucketName: ${AWS_S3_BUCKET_NAME}

  queues:
    model-created: ${AWS_SQS_MODEL_CREATED_QUEUE_URL}
    model-zip-completed: ${AWS_SQS_MODEL_ZIP_COMPLETED_QUEUE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

otel:
  service:
    name: monolith-ecommerce

  exporter:
    otlp:
      endpoint: http://jaeger:4318

  logs:
    exporter: none

  metrics:
    exporter: none

  traces:
    sampler:
      arg: 1
    exporter: otlp

  propagators: tracecontext,baggage