global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "monolith-ecommerce"
    metrics_path: "/api/v1/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]